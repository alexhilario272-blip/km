<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew & Bar POS System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_MENU = [
      { id: 1, name: 'Caramel Macchiato', category: 'Coffee', price: 4.50, stock: 45, image: '☕' },
      { id: 2, name: 'Spanish Latte', category: 'Coffee', price: 4.25, stock: 50, image: '☕' },
      { id: 3, name: 'Strawberry Latte', category: 'Coffee', price: 4.75, stock: 30, image: '🍓' },
      { id: 4, name: 'Gourmet Matcha Latte', category: 'Matcha', price: 5.00, stock: 25, image: '🍵' },
      { id: 5, name: 'Dark Choco', category: 'Specialty', price: 4.00, stock: 40, image: '🍫' },
      { id: 6, name: 'Cookies n Cream', category: 'Specialty', price: 4.75, stock: 35, image: '🍪' },
      { id: 7, name: 'Strawberry Cookie', category: 'Specialty', price: 4.85, stock: 20, image: '🍓' },
      { id: 8, name: 'Strawberry Matcha', category: 'Matcha', price: 5.25, stock: 18, image: '🍵' },
      { id: 9, name: 'Milk Strawberry', category: 'Milk Series', price: 4.25, stock: 28, image: '🥛' },
      { id: 10, name: 'Milk Matcha', category: 'Matcha', price: 4.50, stock: 22, image: '🍵' },
      { id: 11, name: 'Gourmet Matcha', category: 'Matcha', price: 4.75, stock: 15, image: '🍵' },
      { id: 12, name: 'Lychee Soda', category: 'Fruity Sodas', price: 3.75, stock: 60, image: '🥤' },
      { id: 13, name: 'Green Apple Soda', category: 'Fruity Sodas', price: 3.75, stock: 55, image: '🍏' },
      { id: 14, name: 'Strawberry Soda', category: 'Fruity Sodas', price: 3.75, stock: 50, image: '🍓' },
      { id: 15, name: 'Lemon Soda', category: 'Fruity Sodas', price: 3.50, stock: 65, image: '🍋' },
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [currentView, setCurrentView] = useState('pos');
      const [menuItems, setMenuItems] = useState(() => {
        try {
          const saved = localStorage.getItem('pos_menu');
          return saved ? JSON.parse(saved) : INITIAL_MENU;
        } catch(e) { return INITIAL_MENU; }
      });
      const [cart, setCart] = useState([]);
      const [sales, setSales] = useState(() => {
        try {
          const saved = localStorage.getItem('pos_sales');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      useEffect(() => {
        try { localStorage.setItem('pos_menu', JSON.stringify(menuItems)); } catch(e){}
      }, [menuItems]);

      useEffect(() => {
        try { localStorage.setItem('pos_sales', JSON.stringify(sales)); } catch(e){}
      }, [sales]);

      const categories = ['All', ...new Set(INITIAL_MENU.map(i => i.category))];

      const subtotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);
      const tax = subtotal * 0.08;
      const total = subtotal + tax;

      const addToCart = (product) => {
        if (product.stock <= 0) return alert('Item out of stock!');
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            if (existing.quantity >= product.stock) {
              alert('Cannot exceed available stock');
              return prev;
            }
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
      };

      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            const product = menuItems.find(m => m.id === id);
            if (newQty > product.stock) {
              alert('Cannot exceed stock count');
              return item;
            }
            return newQty > 0 ? { ...item, quantity: newQty } : item;
          }
          return item;
        }));
      };

      const handleCheckout = () => {
        if (cart.length === 0) return;
        setMenuItems(prev => prev.map(item => {
          const cartItem = cart.find(c => c.id === item.id);
          return cartItem ? { ...item, stock: item.stock - cartItem.quantity } : item;
        }));

        const newSale = {
          id: 'INV-' + Date.now().toString().slice(-6),
          date: new Date().toISOString(),
          cashier: currentUser?.name || 'Cashier',
          items: cart,
          subtotal,
          tax,
          total
        };

        setSales(prev => [newSale, ...prev]);
        setCart([]);
        alert(`Order ${newSale.id} completed! Total: $${total.toFixed(2)}`);
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
              <div className="text-center mb-8">
                <div className="inline-flex p-3 bg-amber-500/10 text-amber-400 rounded-xl mb-3">
                  <span className="text-3xl">☕</span>
                </div>
                <h1 className="text-2xl font-bold text-white">Brew & Bar POS</h1>
                <p className="text-slate-400 text-sm mt-1">Select a profile to log in</p>
              </div>

              <div className="space-y-4">
                <button 
                  onClick={() => { setCurrentUser({ role: 'admin', name: 'Manager' }); setCurrentView('dashboard'); }}
                  className="w-full py-4 px-6 bg-amber-600 hover:bg-amber-500 text-white font-medium rounded-xl transition flex items-center justify-between"
                >
                  <div className="text-left">
                    <div className="font-bold">Admin Portal</div>
                    <div className="text-xs text-amber-200 opacity-80">Full access: Reports, Inventory, & POS</div>
                  </div>
                  <span>→</span>
                </button>

                <button 
                  onClick={() => { setCurrentUser({ role: 'cashier', name: 'Alex (Cashier)' }); setCurrentView('pos'); }}
                  className="w-full py-4 px-6 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-xl transition flex items-center justify-between border border-slate-600"
                >
                  <div className="text-left">
                    <div className="font-bold">Cashier Station</div>
                    <div className="text-xs text-slate-300">Quick order taking & checkout</div>
                  </div>
                  <span>→</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-950">
          <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
            <div>
              <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                <span className="text-2xl">☕</span>
                <div>
                  <h2 className="font-bold text-amber-400 leading-none">Brew & Bar</h2>
                  <span className="text-xs text-slate-400 uppercase tracking-wider font-semibold">{currentUser.role}</span>
                </div>
              </div>

              <nav className="p-4 space-y-1">
                <button 
                  onClick={() => setCurrentView('pos')} 
                  className={`w-full text-left px-4 py-3 rounded-xl text-sm font-medium transition ${currentView === 'pos' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300 hover:bg-slate-800'}`}
                >
                  🛒 Cashier Register
                </button>

                {currentUser.role === 'admin' && (
                  <>
                    <button 
                      onClick={() => setCurrentView('dashboard')} 
                      className={`w-full text-left px-4 py-3 rounded-xl text-sm font-medium transition ${currentView === 'dashboard' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300 hover:bg-slate-800'}`}
                    >
                      📊 Admin Dashboard
                    </button>
                    <button 
                      onClick={() => setCurrentView('inventory')} 
                      className={`w-full text-left px-4 py-3 rounded-xl text-sm font-medium transition ${currentView === 'inventory' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300 hover:bg-slate-800'}`}
                    >
                      📦 Inventory Tracking
                    </button>
                    <button 
                      onClick={() => setCurrentView('reports')} 
                      className={`w-full text-left px-4 py-3 rounded-xl text-sm font-medium transition ${currentView === 'reports' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300 hover:bg-slate-800'}`}
                    >
                      📈 Sales Reports
                    </button>
                  </>
                )}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800">
              <div className="text-xs text-slate-400 mb-2">Logged in as: <b className="text-slate-200">{currentUser.name}</b></div>
              <button 
                onClick={() => setCurrentUser(null)}
                className="w-full py-2 bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-300 rounded-lg text-sm transition"
              >
                Log Out
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden">
            {currentView === 'pos' && (
              <div className="flex-1 flex flex-col md:flex-row h-full overflow-hidden">
                <div className="flex-1 p-6 overflow-y-auto space-y-6">
                  <div className="flex flex-col sm:flex-row gap-4 justify-between items-stretch">
                    <input 
                      type="text" 
                      placeholder="Search beverage..." 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500 flex-1"
                    />
                    <div className="flex gap-2 overflow-x-auto pb-2 sm:pb-0">
                      {categories.map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition ${selectedCategory === cat ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                    {menuItems
                      .filter(item => selectedCategory === 'All' || item.category === selectedCategory)
                      .filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase()))
                      .map(item => (
                        <div 
                          key={item.id}
                          onClick={() => addToCart(item)}
                          className={`p-4 rounded-2xl border transition cursor-pointer flex flex-col justify-between ${
                            item.stock > 0 
                              ? 'bg-slate-900 border-slate-800 hover:border-amber-500/50' 
                              : 'bg-slate-900/40 border-slate-800/50 opacity-50 cursor-not-allowed'
                          }`}
                        >
                          <div>
                            <div className="text-3xl mb-2">{item.image}</div>
                            <h3 className="font-semibold text-slate-100 text-sm leading-tight">{item.name}</h3>
                            <span className="text-xs text-slate-400">{item.category}</span>
                          </div>
                          <div className="mt-4 flex justify-between items-center">
                            <span className="text-amber-400 font-bold">${item.price.toFixed(2)}</span>
                            <span className={`text-xs px-2 py-0.5 rounded-full ${item.stock < 10 ? 'bg-red-500/20 text-red-400' : 'bg-slate-800 text-slate-400'}`}>
                              {item.stock} left
                            </span>
                          </div>
                        </div>
                      ))}
                  </div>
                </div>

                <div className="w-full md:w-96 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col h-full">
                  <div className="p-4 border-b border-slate-800 flex justify-between items-center">
                    <h2 className="font-bold text-slate-100">Current Order</h2>
                    <button onClick={() => setCart([])} className="text-xs text-red-400 hover:underline">Clear All</button>
                  </div>

                  <div className="flex-1 overflow-y-auto p-4 space-y-3">
                    {cart.length === 0 ? (
                      <div className="text-center py-12 text-slate-500 text-sm">Cart is empty. Tap an item to add.</div>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                          <div>
                            <div className="font-medium text-sm text-slate-200">{item.name}</div>
                            <div className="text-xs text-amber-400">${(item.price * item.quantity).toFixed(2)}</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQuantity(item.id, -1)} className="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs hover:bg-slate-700">-</button>
                            <span className="text-sm font-semibold w-4 text-center">{item.quantity}</span>
                            <button onClick={() => updateQuantity(item.id, 1)} className="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs hover:bg-slate-700">+</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="p-4 border-t border-slate-800 bg-slate-900/50 space-y-2">
                    <div className="flex justify-between text-sm text-slate-400">
                      <span>Subtotal</span>
                      <span>${subtotal.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-sm text-slate-400">
                      <span>Tax (8%)</span>
                      <span>${tax.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-base font-bold text-slate-100 pt-2 border-t border-slate-800">
                      <span>Total</span>
                      <span className="text-amber-400">${total.toFixed(2)}</span>
                    </div>
                    <button 
                      onClick={handleCheckout}
                      disabled={cart.length === 0}
                      className="w-full mt-4 py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-slate-800 disabled:text-slate-600 text-slate-950 font-bold rounded-xl transition"
                    >
                      Process Checkout
                    </button>
                  </div>
                </div>
              </div>
            )}

            {currentView === 'dashboard' && (
              <div className="p-8 overflow-y-auto space-y-6">
                <h1 className="text-2xl font-bold text-slate-100">Executive Overview</h1>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                    <div className="text-xs text-slate-400 uppercase tracking-wider mb-1">Total Revenue</div>
                    <div className="text-3xl font-extrabold text-amber-400">
                      ${sales.reduce((acc, s) => acc + s.total, 0).toFixed(2)}
                    </div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                    <div className="text-xs text-slate-400 uppercase tracking-wider mb-1">Total Transactions</div>
                    <div className="text-3xl font-extrabold text-slate-100">{sales.length}</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                    <div className="text-xs text-slate-400 uppercase tracking-wider mb-1">Low Stock Alerts</div>
                    <div className="text-3xl font-extrabold text-red-400">
                      {menuItems.filter(i => i.stock < 20).length} items
                    </div>
                  </div>
                </div>
              </div>
            )}

            {currentView === 'inventory' && (
              <div className="p-8 overflow-y-auto">
                <h1 className="text-2xl font-bold text-slate-100 mb-6">Inventory Tracking</h1>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-800 text-slate-400 text-xs uppercase">
                      <tr>
                        <th className="p-4">Item Name</th>
                        <th className="p-4">Category</th>
                        <th className="p-4">Price</th>
                        <th className="p-4">Current Stock</th>
                        <th className="p-4">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {menuItems.map(item => (
                        <tr key={item.id} className="hover:bg-slate-850">
                          <td className="p-4 font-medium text-slate-100">{item.name}</td>
                          <td className="p-4">{item.category}</td>
                          <td className="p-4">${item.price.toFixed(2)}</td>
                          <td className="p-4">
                            <span className={`px-2 py-1 rounded-full text-xs ${item.stock < 20 ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'}`}>
                              {item.stock} in stock
                            </span>
                          </td>
                          <td className="p-4">
                            <button 
                              onClick={() => {
                                const newStock = prompt(`Update stock for ${item.name}:`, item.stock);
                                if (newStock !== null && !isNaN(newStock)) {
                                  setMenuItems(prev => prev.map(m => m.id === item.id ? { ...m, stock: parseInt(newStock) } : m));
                                }
                              }}
                              className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-lg text-xs"
                            >
                              Edit Stock
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {currentView === 'reports' && (
              <div className="p-8 overflow-y-auto space-y-6">
                <h1 className="text-2xl font-bold text-slate-100">Sales Reports</h1>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                  <div className="p-4 border-b border-slate-800 font-semibold text-slate-200">Recent Transactions</div>
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-800 text-slate-400 text-xs uppercase">
                      <tr>
                        <th className="p-4">Invoice ID</th>
                        <th className="p-4">Date</th>
                        <th className="p-4">Cashier</th>
                        <th className="p-4">Items Sold</th>
                        <th className="p-4">Total Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {sales.length === 0 ? (
                        <tr><td colSpan="5" className="p-8 text-center text-slate-500">No transactions recorded yet.</td></tr>
                      ) : (
                        sales.map(s => (
                          <tr key={s.id}>
                            <td className="p-4 font-mono text-amber-400">{s.id}</td>
                            <td className="p-4">{new Date(s.date).toLocaleString()}</td>
                            <td className="p-4">{s.cashier}</td>
                            <td className="p-4">{s.items.map(i => `${i.name} (x${i.quantity})`).join(', ')}</td>
                            <td className="p-4 font-bold text-slate-100">${s.total.toFixed(2)}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
